<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="NV-01 23 actuated degrees of freedom">
  <rect width="720" height="420" fill="#111214"/>
  <text x="28" y="36" fill="#f2f2f2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600">NV-01 · 23 actuated DOF</text>
  <text x="28" y="58" fill="#8b9098" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">No hands. No neck. Head is a box on the torso.</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="28" y="88" width="210" height="88" fill="#1b1d22" stroke="#2c3038"/>
    <text x="44" y="122" fill="#f2f2f2" font-size="28" font-weight="700">12</text>
    <text x="44" y="148" fill="#8b9098" font-size="13">legs · 6 per side</text>
    <rect x="254" y="88" width="210" height="88" fill="#1b1d22" stroke="#2c3038"/>
    <text x="270" y="122" fill="#f2f2f2" font-size="28" font-weight="700">1</text>
    <text x="270" y="148" fill="#8b9098" font-size="13">waist yaw</text>
    <rect x="480" y="88" width="212" height="88" fill="#1b1d22" stroke="#2c3038"/>
    <text x="496" y="122" fill="#f2f2f2" font-size="28" font-weight="700">10</text>
    <text x="496" y="148" fill="#8b9098" font-size="13">arms · 5 per side</text>
    <rect x="28" y="196" width="664" height="88" fill="#1b1d22" stroke="#2c3038"/>
    <text x="44" y="230" fill="#f2f2f2" font-size="16">Out of spec</text>
    <text x="44" y="256" fill="#8b9098" font-size="13">fingers 0 · neck 0 · a boxing glove is a foam cup on the flange</text>
    <rect x="28" y="304" width="328" height="88" fill="#1b1d22" stroke="#2c3038"/>
    <text x="44" y="338" fill="#f2f2f2" font-size="16">Legs / waist</text>
    <text x="44" y="364" fill="#8b9098" font-size="13">DM 10010L · ~120 N·m · 13 joints</text>
    <rect x="372" y="304" width="320" height="88" fill="#1b1d22" stroke="#2c3038"/>
    <text x="388" y="338" fill="#f2f2f2" font-size="16">Arms / ankles</text>
    <text x="388" y="364" fill="#8b9098" font-size="13">DM 4340P · ~27 N·m · 10 joints</text>
  </g>
</svg>
