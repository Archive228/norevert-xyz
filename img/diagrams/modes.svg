<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="Policy modes">
  <rect width="720" height="240" fill="#0d0f13"/>
  <text x="28" y="38" fill="#f2f3f5" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="600">Fight modes on the roadmap</text>
  <text x="28" y="60" fill="#8b9098" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5">23 actions on this skeleton. A 29-DOF G1 boxing ONNX will not load here.</text>
  <rect x="28" y="92" width="122" height="110" rx="6" fill="#14171c" stroke="#e9c227"/>
  <text x="42" y="136" fill="#f2f3f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600">get-up</text>
  <text x="42" y="176" fill="#e9c227" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">first</text>
  <rect x="162" y="92" width="122" height="110" rx="6" fill="#14171c" stroke="#e9c227"/>
  <text x="176" y="136" fill="#f2f3f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600">guard</text>
  <text x="176" y="176" fill="#e9c227" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">second</text>
  <rect x="296" y="92" width="122" height="110" rx="6" fill="#14171c" stroke="#262b33"/>
  <text x="310" y="136" fill="#f2f3f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600">jab</text>
  <text x="310" y="176" fill="#8b9098" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">after the body stands</text>
  <rect x="430" y="92" width="122" height="110" rx="6" fill="#14171c" stroke="#262b33"/>
  <text x="444" y="136" fill="#f2f3f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600">hook</text>
  <text x="444" y="176" fill="#8b9098" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">after the body stands</text>
  <rect x="564" y="92" width="122" height="110" rx="6" fill="#14171c" stroke="#262b33"/>
  <text x="578" y="136" fill="#f2f3f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600">front kick</text>
  <text x="578" y="176" fill="#8b9098" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">after the body stands</text>
  <text x="28" y="228" fill="#8b9098" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">Legs are a balance policy. Arms are a pad or a headset. A jab that dumps the robot is not a jab.</text>
</svg>
