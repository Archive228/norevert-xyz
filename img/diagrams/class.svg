<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="40 kg class next to an 80 kg T800">
  <rect width="720" height="340" fill="#0d0f13"/>
  <text x="28" y="38" fill="#f2f3f5" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="600">Fight class</text>
  <text x="28" y="60" fill="#8b9098" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5">Same neighbourhood as a G1. Not a T800.</text>
  <rect x="28" y="88" width="326" height="220" rx="6" fill="#14171c" stroke="#e9c227"/>
  <text x="44" y="124" fill="#f2f3f5" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="700">NV-01 · 40 kg class</text>
  <text x="44" y="154" fill="#8b9098" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">1.25 m · 33.76 kg · 23 DOF</text>
  <text x="44" y="178" fill="#8b9098" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">arms ~27 N·m · legs ~120 N·m</text>
  <text x="44" y="202" fill="#8b9098" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">open CAD, commodity actuators</text>
  <text x="44" y="288" fill="#e9c227" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">this robot</text>
  <rect x="366" y="88" width="326" height="220" rx="6" fill="#14171c" stroke="#262b33"/>
  <text x="382" y="124" fill="#f2f3f5" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="700">T800 · 80 kg class</text>
  <text x="382" y="154" fill="#8b9098" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">~1.73–1.80 m · 75–85 kg · 29 DOF</text>
  <text x="382" y="178" fill="#8b9098" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">claimed ~450 N·m</text>
  <text x="382" y="202" fill="#8b9098" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">closed league hardware</text>
  <text x="382" y="288" fill="#8b9098" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">not this robot</text>
</svg>
