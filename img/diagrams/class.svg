<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="NV-01 is 40 kilogram class, not T800">
  <rect width="720" height="300" fill="#111214"/>
  <text x="28" y="36" fill="#f2f2f2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600">Fight class</text>
  <text x="28" y="58" fill="#8b9098" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Same neighbourhood as a G1. Not a T800.</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="28" y="84" width="328" height="180" fill="#1b1d22" stroke="#d7dde6"/>
    <text x="48" y="124" fill="#f2f2f2" font-size="18" font-weight="600">NV-01 / 40 kg</text>
    <text x="48" y="156" fill="#c8cdd4" font-size="14">1.25 m · 33.76 kg · 23 DOF</text>
    <text x="48" y="180" fill="#8b9098" font-size="13">arms ~27 N·m</text>
    <text x="48" y="202" fill="#8b9098" font-size="13">legs ~120 N·m</text>
    <text x="48" y="232" fill="#f2f2f2" font-size="13">this robot</text>
    <rect x="372" y="84" width="320" height="180" fill="#1b1d22" stroke="#2c3038"/>
    <text x="392" y="124" fill="#f2f2f2" font-size="18" font-weight="600">T800 / 80 kg</text>
    <text x="392" y="156" fill="#c8cdd4" font-size="14">~1.731.80 m · 7585 kg · 29 DOF</text>
    <text x="392" y="180" fill="#8b9098" font-size="13">claimed ~450 N·m</text>
    <text x="392" y="202" fill="#8b9098" font-size="13">closed league hardware</text>
    <text x="392" y="232" fill="#8b9098" font-size="13">not this robot</text>
  </g>
</svg>
